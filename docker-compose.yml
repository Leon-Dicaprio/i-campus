services:
  mysql:
    image: mysql:8.0
    pull_policy: missing
    container_name: icampus-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: icampus
      MYSQL_USER: icampus_user
      MYSQL_PASSWORD: icampus_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
